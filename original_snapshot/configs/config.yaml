total_run_time: 86400  # 24 * 3600

parameters:
    ug_truth: 10
    K_truth: 1
    # Ensemble parameters are centred around (param_truth +/- error)
    ug_error: 2
    K_error: 1.5

ensemble: 
    ensemble_size: 20
    sigma_ug: 1.5       # Gaussian N(ug_truth, sigma_ug)
    spread_K: 1.5        # If K is uniform this is max(K+/- simga_K, 0)


data_assimilation:
    t0_assim: 14400     # 4 * 3600
    dt_assim: 7200      # 2 * 3600
    n_assim: 1
    state_vars: ["ug","K","u","v"]

observations:
    z_obs: [100, 200, 300, 400]    # in meters
    # z_obs: [50, 100, 150, 200, 250, 300, 350, 400, 450]    # in meters
    obs_error: 0.25             # Observation Error Standard-Deviation
    obs_vars: ["u","v"]
